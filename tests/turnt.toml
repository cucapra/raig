[envs.outputs]
command = '''
bash -c 'diff -u <(../target/debug/raig simulate {filename} inputs/{base}.stim | cut -d" " -f3) <(aigsim {filename} inputs/{base}.stim | grep -v "^Trace is a witness for:" | cut -d" " -f3)'
'''
output = {}
