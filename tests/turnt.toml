[envs.raw]
command = "../target/debug/raig dot {filename}"
out_dir = "../aiger/outputs"
output."raw.dot" = "-"

[envs.opt]
command = "../target/debug/raig dot {filename} --pre-optimize"
out_dir = "../aiger/outputs"
output."opt.dot" = "-"

[envs.aag]
command = "../target/debug/raig convert --ascii {filename}"
out_dir = "../../aiger/outputs"
output.aag = "-"

[envs.aig]
command = "../target/debug/raig convert --binary {filename}"
out_dir = "../../aiger/outputs"
output.aig = "-"

