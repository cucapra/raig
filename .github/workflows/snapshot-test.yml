name: Push CI for Snapshot Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Turnt
        run: uv tool install turnt

      - name: Run formatter
        run: cargo fmt --all

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Run unit tests
        run: cargo test --workspace

      - name: Build debug binary
        run: cargo build -p raig-cli --bin raig

      - name: Run AIGER snapshot tests
        run: turnt -e raw -e opt tests/inputs/*.aag

      - name: Run AIGER snapshot tests on HRT benchmarks
        run: turnt -e raw -e opt benchmark/hrt/*.aig
