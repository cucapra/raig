name: Benchmarks

on:
  workflow_dispatch:

env:
  CARGO_TARGET_DIR: target/benchmarks

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind hyperfine

      - name: Build raig
        run: |
          cargo build --locked --release -p raig-cli

      - name: Measure parsing runtime
        run: |
          mkdir -p results
          for binary in tests/inputs/hrt/*.aig; do
            name=$(basename "$binary" .aig)
            ascii="results/$name.aag"
            ./target/benchmarks/release/raig convert "$binary" --ascii --output "$ascii"
            for input in "$binary" "$ascii"; do
              format="${input##*.}"
              hyperfine --shell=none --warmup 3 --runs 30 \
                --export-json "results/runtime-$name-$format.json" \
                "./target/benchmarks/release/raig parse '$input'" \
                "./target/benchmarks/release/raig parse '$input' --pre-optimize"
            done
          done

      - name: Profile raig memory
        run: |
          for input in tests/inputs/hrt/*.aig; do
            name=$(basename "$input" .aig)
            valgrind --tool=massif --time-unit=B \
              --massif-out-file="results/massif-raig-$name.out" \
              ./target/benchmarks/release/raig parse "$input"
            ms_print "results/massif-raig-$name.out" > "results/massif-raig-$name.txt"
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/*.json
            results/*.out
            results/*.txt
